<!DOCTYPE html>
<html lang="pt-BR">

  <title>{% block title %}{{ salon_name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

</html>
