<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · {{ salon_name }}</title>
  <link rel="stylesheet" href="/static/css/style.css?v=2026-10-12-apk-download">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<main class="narrow login-box">
  <img class="login-brand-mark" src="/static/icons/icon-192.png?v=2" alt="" width="64" height="64">
  <p class="eyebrow">Área administrativa</p>
  <h1>{{ salon_name }}</h1>
  {% if error %}<p class="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/login" class="booking">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>
      Senha
      <input type="password" name="password" required>
    </label>
    <button class="btn" type="submit">Entrar</button>
  </form>
</main>
</body>
</html>
