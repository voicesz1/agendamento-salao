<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Painel{% endblock %} · {{ salon_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="top admin-top">
    <a class="brand" href="/admin">Painel · {{ salon_name }}</a>
    <nav>
      <a href="/admin">Agendamentos</a>
      <a href="/admin/servicos">Serviços</a>
      <a href="/admin/horarios">Horários</a>
      <a href="/admin/config">Configurações</a>
      <a href="/">Ver site</a>
      <form method="post" action="/admin/sair" class="inline-form">
        <input type="hidden" name="csrf" value="{{ csrf_token }}">
        <button class="linkish" type="submit">Sair</button>
      </form>
    </nav>
  </header>
  <main class="admin-main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
